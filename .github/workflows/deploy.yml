name: Inject Navbar and Bottom

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run inject
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 << 'EOF'
          import yaml, glob, re, os, subprocess, datetime
          import posixpath
          from urllib.parse import quote

          OWNER = "TouriCN"
          REPO  = "TouriCN"
          BRANCH = os.environ.get("GITHUB_REF_NAME", "main")

          with open('nav.yml') as f:
              cfg = yaml.safe_load(f)

          brand = cfg['brand']
          navbar_items = cfg['navbar']
          scan_dirs = cfg.get('scan_dirs', ['.'])
          exclude = set(os.path.normpath(p) for p in (cfg.get('exclude') or []))
          bottom_text = (cfg.get('bottom') or '').strip()

          LINK_RE = re.compile(r'(!?\[)([^\]]*)\]\((\s*[^)\s][^)]*?\s*)\)')

          def abs_link(source_md, target):
              target = target.strip()
              if target.startswith(("http://", "https://", "mailto:", "tel:")):
                  return target
              if target.startswith("#"):
                  return target
              frag = ""
              for sep in ("#", "?"):
                  i = target.find(sep)
                  if i != -1:
                      frag = target[i:]
                      target = target[:i]
                      break
              if target.startswith("/"):
                  resolved = target[1:]
              else:
                  doc_dir = posixpath.dirname(source_md) if source_md else ""
                  resolved = posixpath.join(doc_dir, target)
              resolved = posixpath.normpath(resolved).replace("\\", "/")
              if resolved == "." or resolved == "":
                  resolved = ""
              safe = quote(resolved, safe="/")
              if not safe:
                  return target
              return f"https://github.com/{OWNER}/{REPO}/blob/{BRANCH}/{safe}{frag}"

          def rewrite_links(text, source_md):
              def repl(m):
                  prefix, label, raw = m.group(1), m.group(2), m.group(3)
                  return f"{prefix}{label}]({abs_link(source_md, raw.strip())})"
              return LINK_RE.sub(repl, text)

          auto_groups = {}
          file2group = {}
          for scan_dir in scan_dirs:
              if not os.path.isdir(scan_dir):
                  continue
              for root, dirs, _ in os.walk(scan_dir):
                  if root == scan_dir:
                      continue
                  gname = os.path.basename(root)
                  pages = []
                  for md in sorted(glob.glob(os.path.join(root, '*.md'))):
                      with open(md, 'r') as mf:
                          first = mf.readline().strip()
                      if first.startswith('# '):
                          title = first[2:].strip()
                      else:
                          title = os.path.splitext(os.path.basename(md))[0]
                      rel_link = os.path.normpath(md).replace(os.sep, '/')
                      pages.append((title, rel_link))
                  if pages:
                      auto_groups[gname] = pages
                      for _, link in pages:
                          file2group[link] = gname

          nav_links = " &nbsp; ".join(
              f'<a href="{abs_link("", link)}">{name}</a>'
              for item in navbar_items
              for name, link in [item.split(', ', 1)]
          )

          NAV = (
              "<!-- NAV-START -->\n"
              "<div align=\"center\">\n\n"
              f"<table><tr><td><strong>{brand}</strong></td>"
              f"<td>{nav_links}</td></tr></table>\n\n"
              "</div>\n"
              "<!-- NAV-END -->"
          )

          def last_edit_time(path):
              try:
                  out = subprocess.check_output(
                      ['git', 'log', '--format=%aI|%an', '--', path]
                  ).decode().strip()
                  if not out:
                      return None
                  for line in out.splitlines():
                      date_str, author = line.split('|', 1)
                      if 'github-actions' not in author.lower():
                          dt = datetime.datetime.fromisoformat(date_str.replace('Z', '+00:00'))
                          return dt.astimezone().strftime('%Y-%m-%d %H:%M')
                  return None
              except Exception:
                  return None

          files = glob.glob('*.md') + glob.glob('**/*.md', recursive=True)

          for path in files:
              norm = os.path.normpath(path).replace(os.sep, '/')
              with open(path, 'r') as f:
                  content = f.read()

              content = rewrite_links(content, norm)

              if '<!-- NAV-START -->' in content:
                  content = re.sub(r'<!-- NAV-START -->.*?<!-- NAV-END -->',
                                   NAV, content, flags=re.DOTALL)
              else:
                  content = NAV + '\n\n' + content

              bottom = []
              edit_time = last_edit_time(path)
              bottom.append(f'<p><em>最后更新：{edit_time or "—"}</em></p>')

              if norm in file2group and norm not in exclude:
                  gname = file2group[norm]
                  pages = auto_groups[gname]
                  lines = []
                  for title, link in pages:
                      if link == norm:
                          lines.append(f"<strong>{title}</strong>（当前）")
                      else:
                          lines.append(f'<a href="{abs_link("", link)}">{title}</a>')
                  bottom.append('<div align="center">')
                  bottom.append(f'<table><tr><td><strong>{gname}</strong></td><td>{"<br>".join(lines)}</td></tr></table>')
                  bottom.append('</div>')

              if bottom_text:
                  bottom.append(bottom_text)

              BOTTOM = '<!-- BOTTOM-START -->\n---\n' + '\n'.join(bottom) + '\n<!-- BOTTOM-END -->'
              if '<!-- BOTTOM-START -->' in content:
                  content = re.sub(r'<!-- BOTTOM-START -->.*?<!-- BOTTOM-END -->',
                                   BOTTOM, content, flags=re.DOTALL)
              else:
                  content = content.rstrip() + '\n\n' + BOTTOM

              with open(path, 'w') as f:
                  f.write(content)
              print(f"done: {path}")

          print("navbar + bottom injected")
          EOF

      - name: 注入站点信息到 profile/README.md
        run: |
          python3 << 'EOF'
          import re, glob, os, subprocess, datetime

          os.makedirs('profile', exist_ok=True)
          profile_path = 'profile/README.md'
          if not os.path.exists(profile_path):
              with open(profile_path, 'w') as f:
                  f.write('# TouriCN\n')

          def git_log(fmt):
              return subprocess.check_output(['git', 'log', '-1', f'--format={fmt}']).decode().strip()

          author = os.environ.get('GITHUB_ACTOR', git_log('%an'))
          msg = git_log('%s')
          hash_short = subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD']).decode().strip()

          try:
              out = subprocess.check_output(
                  ['git', 'log', '-1', '--format=%aI', '--', profile_path]
              ).decode().strip()
              if out:
                  build_time = datetime.datetime.fromisoformat(out.replace('Z', '+00:00')).astimezone().strftime('%Y/%m/%d %H:%M:%S')
              else:
                  build_time = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime('%Y/%m/%d %H:%M:%S')
          except Exception:
              build_time = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime('%Y/%m/%d %H:%M:%S')

          files = [f for f in glob.glob('**/*.md', recursive=True)
                   if 'node_modules' not in f and '.git' not in f]
          total_files = len(files)
          total_words = 0
          for f in files:
              with open(f, 'r', encoding='utf-8') as mf:
                  c = mf.read()
              chinese = len(re.findall(r'[\u4e00-\u9fa5]', c))
              english = len(re.findall(r'[a-zA-Z]+', c))
              total_words += chinese + english
          avg_words = total_words // total_files if total_files > 0 else 0

          table = f"""<!-- SITE_INFO_START -->
          ## 站点信息

          | 字段 | 值 |
          | :---: | :---: |
          | 构建时间 | {build_time} |
          | 提交者 | {author} |
          | 提交信息 | {msg} |
          | 提交哈希 | {hash_short} |
          | 文件数 | {total_files} |
          | 总字数 | {total_words} |
          | 每文件平均字数 | {avg_words} |

          <!-- SITE_INFO_END -->"""

          with open(profile_path, 'r') as f:
              c = f.read()

          if '<!-- SITE_INFO_START -->' in c:
              c = re.sub(r'<!-- SITE_INFO_START -->.*?<!-- SITE_INFO_END -->', table, c, flags=re.DOTALL)
          else:
              c = c.rstrip() + '\n\n' + table

          with open(profile_path, 'w') as f:
              f.write(c)

          print("site info injected")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: inject navbar and bottom [skip ci]"
          git push
